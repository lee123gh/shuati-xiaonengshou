    <script>
// ==================== 题库开始 ====================
        // 题目格式说明：
        // type: "single" 表示单选题，"judge" 表示判断题
        // options: 选项（单选题用数组，判断题不需要）
        // answer: 正确答案（单选题为选项字母，判断题为 "正确" 或 "错误"）
        // explanation: 解析内容

        // 题库数据（按需从banks/文件夹加载）
        let lifeguardBank = [];
        let instructorBank = [];
        let lifeguardBankSenior = [];
        let instructorBankSenior = [];

        // 已加载的题库标记
        const loadedBanks = { lifeguard: false, lifeguard_senior: false, instructor: false, instructor_senior: false };

        // 顺序刷题题库（按需加载）
        let orderedLifeguardBank = null;
        let orderedInstructorBank = null;
        let orderedInstructorSeniorBank = null;
        const loadedOrderedBanks = { lifeguard: false, instructor: false, instructor_senior: false };

        // 顺序刷题状态
        let sequentialBank = null;
        let sequentialFlatQuestions = [];
        let sequentialCurrentIdx = 0;
        let sequentialMode = false;
        let isTransitioning = false; // 防止页面切换并发执行

        // 异步加载题库
        async function loadBankData(bankType) {
            if (loadedBanks[bankType]) return;

            const bankFiles = {
                'lifeguard': 'banks/lifeguard.json',
                'lifeguard_senior': 'banks/lifeguard_senior.json',
                'instructor': 'banks/instructor.json',
                'instructor_senior': 'banks/instructor_senior.json'
            };

            try {
                const response = await fetch(bankFiles[bankType] + '?' + BANK_VERSION);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                switch(bankType) {
                    case 'lifeguard':
                        lifeguardBank = data;
                        document.getElementById('lifeguardCount').textContent = `共 ${lifeguardBank.length} 题`;
                        break;
                    case 'lifeguard_senior':
                        lifeguardBankSenior = data;
                        break;
                    case 'instructor':
                        instructorBank = data;
                        document.getElementById('instructorCount').textContent = `共 ${instructorBank.length} 题`;
                        break;
                    case 'instructor_senior':
                        instructorBankSenior = data;
                        break;
                }
                loadedBanks[bankType] = true;
            } catch (e) {
                console.error('加载题库失败:', bankType, e);
            }
        }

        // 版本号常量（用于题库缓存控制，更新题库时修改此值）
        const BANK_VERSION = 'v20260727';

        // 页面加载时延迟预加载（不阻塞首屏渲染）
        setTimeout(function() {
            loadBankData('lifeguard');
            loadBankData('instructor');
        }, 500);

        // 异步加载顺序题库（使用缓存优化加载速度）
        async function loadOrderedBankData(bankType) {
            if (loadedOrderedBanks[bankType]) return;
            const files = {
                'lifeguard': 'banks/order_lifeguard.json',
                'instructor': 'banks/order_instructor.json',
                'instructor_senior': 'banks/order_instructor_senior.json'
            };

        // ==================== 安全工具 ====================
        // SHA-256哈希（纯JS实现，不依赖Web Crypto API以兼容旧浏览器）
        function _sha256(str) {
            function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
            var mathPow = Math.pow;
            var maxWord = mathPow(2, 32);
            var lengthProperty = 'length';
            var i, j;
            var result = '';
            var words = [];
            var asciiBitLength = str[lengthProperty] * 8;
            var hash = [];
            var k = [];
            var primeCounter = 0;
            var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
                    hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
                }
            }
            str += '\x80';
            while (str[lengthProperty] % 64 - 56) str += '\x00';
            for (i = 0; i < str[lengthProperty]; i++) {
                j = str.charCodeAt(i);
                if (j >> 8) return;
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            for (j = 0; j < words[lengthProperty];) {
                var w = words.slice(j, j += 16);
                var oldHash = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    var w15 = w[i - 15], w2 = w[i - 2];
                    var a = hash[0], e = hash[4];
                    var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                        + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
                        + (w[i] = (i < 16) ? w[i] : (
                            w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                            + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                        ) | 0);
                    var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
            }
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    var b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? '0' : '') + b.toString(16);
                }
            }
            return result;
        }

        // ==================== 密码验证系统 ====================
        // 密码格式：6位字母数字，编码过期日期
        // 第1-2位=年后两位，第3-4位=月，第5-6位=日
        const _XK = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        const _XO = 5;

        function _xc2v(c1, c2) {
            let i1 = _XK.indexOf(c1.toUpperCase());
            let i2 = _XK.indexOf(c2.toUpperCase());
            if (i1 < 0 || i2 < 0) return -1;
            let raw1 = (i1 - _XO + 320) % 32;
            let raw2 = (i2 - _XO - 3 + 320) % 32;
            let v = raw1 * 4 + Math.floor(raw2 / 8);
            return v % 32;
        }

        // 解码密码：6位字符 → 过期日期字符串 YYYYMMDD
        function _xd(pw) {
            if (pw.length !== 6) return null;
            let y2 = _xc2v(pw[0], pw[1]);
            let m = _xc2v(pw[2], pw[3]);
            let d = _xc2v(pw[4], pw[5]);
            if (y2 < 0 || m < 0 || d < 0) return null;
            if (m < 1 || m > 12 || d < 1 || d > 31) return null;
            let year = 2000 + y2;
            return '' + year + String(m).padStart(2,'0') + String(d).padStart(2,'0');
        }

        // 验证密码
        function verifyPassword() {
            const inputs = document.querySelectorAll('#passwordInputs input');
            let pw = '';
            inputs.forEach(inp => pw += inp.value);
            
            if (pw.length !== 6) {
                document.getElementById('passwordError').textContent = '请输入6位密码';
                return;
            }

            const expireStr = _xd(pw);
            if (!expireStr) {
                document.getElementById('passwordError').textContent = '密码无效，请检查后重试';
                return;
            }

            const now = new Date();
            const nowStr = '' + now.getFullYear() +
                String(now.getMonth()+1).padStart(2,'0') +
                String(now.getDate()).padStart(2,'0');

            if (nowStr > expireStr) {
                document.getElementById('passwordError').textContent = '密码已过期，请联系老师获取新密码';
                return;
            }

            // 验证通过
            localStorage.setItem('quiz_auth', pw);
            localStorage.setItem('quiz_expire', expireStr);
            document.getElementById('passwordPage').style.display = 'none';
            document.getElementById('homePage').classList.remove('hidden');
            initHome();
        }

        function verifyDurationPassword(pw, days) {
            const expireStr = _xd(pw);
            if (!expireStr) {
                document.getElementById('passwordError').textContent = '密码无效，请联系老师获取新密码';
                return;
            }
            const now = new Date();
            const nowStr = '' + now.getFullYear() +
                String(now.getMonth()+1).padStart(2,'0') +
                String(now.getDate()).padStart(2,'0');
            if (nowStr > expireStr) {
                document.getElementById('passwordError').textContent = '密码已过期（' + days + '天授权），请联系老师获取新密码';
                return;
            }
            localStorage.setItem('quiz_auth', pw);
            localStorage.setItem('quiz_expire', expireStr);
            document.getElementById('passwordPage').style.display = 'none';
            document.getElementById('homePage').classList.remove('hidden');
            initHome();
        }

                
        // 管理员密码（永久有效）
        // 管理员密码验证（SHA-256哈希比对，源码无明文）
        const _AH = '2ef761877b9ce9e19a851984db113958b6f6c87fbad856170ff3b82f9821f7fe';
        // 支持自定义密码（优先读取localStorage）
        function _getAdminHash() {
            const custom = localStorage.getItem('_quiz_ah');
            return custom || _AH;
        }
        function _verifyAdmin(pwd) {
            const hash = _sha256(pwd);
            return hash === _getAdminHash();
        }

        // 统一密码提交 - 自动判断登录密码或管理员密码
        function submitPassword() {
            const input = document.getElementById('mainPasswordInput');
            const pw = input.value.trim();
            
            if (!pw) {
                document.getElementById('passwordError').textContent = '请输入密码';
                return;

            // 先检查是否为管理员密码（SHA-256哈希比对）
            if (_verifyAdmin(pw)) {
                localStorage.setItem('quiz_auth', 'ADMIN');
                localStorage.setItem('quiz_expire', '99991231');

                document.getElementById('homePage').classList.remove('hidden');
                initHome();
                return;
            }

            // 再检查是否为6位登录密码
            if (pw.length === 6) {
                const pwUpper = pw.toUpperCase();
                const expireStr = _xd(pwUpper);
                if (!expireStr) {
                    document.getElementById('passwordError').textContent = '密码无效，请联系老师获取新密码';
                    return;
                }
                const now = new Date();
                const nowStr = '' + now.getFullYear() +

                if (nowStr > expireStr) {
                    document.getElementById('passwordError').textContent = '密码已过期，请联系老师获取新密码';
                    return;

                localStorage.setItem('quiz_auth', pwUpper);
                localStorage.setItem('quiz_expire', expireStr);
                document.getElementById('passwordPage').style.display = 'none';
                document.getElementById('homePage').classList.remove('hidden');

                return;

            document.getElementById('passwordError').textContent = '密码无效，请联系老师获取新密码';
        }

        // 检查已存储的验证状态
        function checkStoredAuth() {
            const pw = localStorage.getItem('quiz_auth');
            const expire = localStorage.getItem('quiz_expire');
            const isAdmin = localStorage.getItem('quiz_admin');
            if (!pw || !expire) return false;
            
            // 管理员永久有效
            if (isAdmin === 'true' && pw === 'ADMIN') {
                return true;
            }
            
            const now = new Date();
            const nowStr = '' + now.getFullYear() +
                String(now.getMonth()+1).padStart(2,'0') +
                String(now.getDate()).padStart(2,'0');
            
            if (nowStr > expire) {
                localStorage.removeItem('quiz_auth');
                localStorage.removeItem('quiz_expire');
                localStorage.removeItem('quiz_admin');
                return false;
            }
            // 重新验证密码有效性
            const decoded = _xd(pw);
            if (!decoded || decoded !== expire) {
                localStorage.removeItem('quiz_auth');
                localStorage.removeItem('quiz_expire');
                localStorage.removeItem('quiz_admin');
                return false;
            }
            return true;
        }

        // 密码输入框交互逻辑
        function setupPasswordInputs() {
            const inputs = document.querySelectorAll('#passwordInputs input');
            inputs.forEach((inp, idx) => {
                inp.addEventListener('input', (e) => {
                    const val = e.target.value.toUpperCase();
                    e.target.value = val;
                    if (val && idx < 5) inputs[idx+1].focus();
                    if (idx === 5 && val) verifyPassword();
                });
                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                        inputs[idx-1].focus();
                    }
                    if (e.key === 'Enter') verifyPassword();
                });
                inp.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text').toUpperCase();
                    for (let i = 0; i < Math.min(text.length, 6); i++) {
                        if (inputs[i]) inputs[i].value = text[i];
                    }
                    if (text.length >= 6) verifyPassword();
                });
            });
        }

            const baseBank = await getQuestionBank(); // 根据类型和等级获取题库
            
            // 隐藏加载提示
            hideLoading();
            
            // 如果是模拟考试模式，按题型比例判断30%:单选60%:多选10%抽取
            if (mode === 'exam') {
                const examResult = prepareExamQuestions(baseBank);
                if (!examResult || !Array.isArray(examResult.questions)) {
                    console.error('prepareExamQuestions返回异常:', examResult);
                    currentQuestionBank = Array.isArray(baseBank) ? baseBank.slice(0, 100) : [];
                    bankInsufficient = true;
                } else {
                    currentQuestionBank = examResult.questions;
                    bankInsufficient = examResult.insufficient;
                }
                // 防御性检查：确保模拟考试题目数量正确
                const config = getExamConfig();
                const expectedCount = config && typeof config.totalQuestions === 'number' ? config.totalQuestions : 100;
                if (currentQuestionBank.length !== expectedCount) {
                    console.error('模拟考试题目数量异常:', currentQuestionBank.length, '期望:', expectedCount);
                    // 如果数量异常，重新从baseBank抽取
                    if (Array.isArray(baseBank)) {
                        currentQuestionBank = baseBank.slice(0, expectedCount);
                    }
                    if (currentQuestionBank.length < expectedCount) {
                        bankInsufficient = true;
                    }
                }
            } else {
                // 随机刷题模式，按题型比例抽取
                currentQuestionBank = shuffleQuestions(baseBank);
                bankInsufficient = false;
            }
            
            // 切换页面显示
            document.getElementById('modeSelectPage').classList.add('hidden');
            document.getElementById('quizPage').classList.remove('hidden');
            document.getElementById('listToggleBtn').classList.remove('hidden');

                document.getElementById('bankWarningText').textContent = 
                    `当前题库不足${config.totalQuestions}题，已使用全部可用题目（共 ${currentQuestionBank.length} 题）`;

                document.getElementById('bankWarning').classList.add('hidden');

            // 更新页面标题（包含等级信息）
            const levelDisplay = currentLevel + (currentExamType === '救生员' ? '救生员' : '游泳指导员');
            document.getElementById('currentExamType').textContent = levelDisplay;
            
            const config = getExamConfig();
            document.getElementById('pageTitle').textContent = 
                mode === 'random' ? '随机刷题' : `模拟考试（${config.totalQuestions}题）`;
            
            // 显示计时器和交卷按钮
            if (mode === 'exam') {
                document.getElementById('timerBar').classList.remove('hidden');
                document.getElementById('submitAllBtn').style.display = '';
                startTimer();
            } else {
                document.getElementById('timerBar').classList.add('hidden');
                document.getElementById('submitAllBtn').style.display = 'none';
            }
            
            // 重置状态并初始化
            currentIndex = 0;
            userAnswers = new Array(currentQuestionBank.length).fill(null);
            isAnswered = false;
            examFinished = false;
            
            renderQuestionList();
            showQuestion(0);
            isTransitioning = false; // 释放锁
        }

        // 获取当前考试配置
        function getExamConfig() {
            return currentExamType === '救生员' ? LIFEGUARD_EXAM_CONFIG : INSTRUCTOR_EXAM_CONFIG;
        }
        
        // 准备模拟考试题目
        function prepareExamQuestions(bank) {
            const config = getExamConfig();
            // 防御性默认值
            const singleCount = config && typeof config.singleCount === 'number' ? config.singleCount : 60;
            const judgeCount = config && typeof config.judgeCount === 'number' ? config.judgeCount : 30;
            const multipleCount = config && typeof config.multipleCount === 'number' ? config.multipleCount : 10;
            const totalQuestions = config && typeof config.totalQuestions === 'number' ? config.totalQuestions : 100;

            if (!Array.isArray(bank)) {
                console.error('prepareExamQuestions: bank不是数组', bank);
                return { questions: [], insufficient: true, config };
            }

            // 过滤掉选项不完整的题目（single需要4选项，multiple需要4选项）
            const validBank = bank.filter(q => {
                if (q.type === 'single') return q.options && q.options.length >= 4;
                if (q.type === 'multiple') return q.options && q.options.length >= 4;
                return true; // judge类型不需要选项
            });
            const singles = validBank.filter(q => q.type === 'single');
            const judges = validBank.filter(q => q.type === 'judge');
            const multiples = validBank.filter(q => q.type === 'multiple');

            // Fisher-Yates洗牌算法，确保彻底打乱
            const shuffle = arr => {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            };

            // 按配置的比例抽取题目
            const selectedSingles = shuffle([...singles]).slice(0, singleCount);
            const selectedJudges = shuffle([...judges]).slice(0, judgeCount);

            // 抽取多选题，不足时用单选题补位
            let selectedMultiples = shuffle([...multiples]).slice(0, multipleCount);
            let multipleDeficit = multipleCount - selectedMultiples.length;
            if (multipleDeficit > 0) {
                // 从剩余单选题中补位
                const usedQuestions = new Set(selectedSingles.map(q => q.question));
                const remainingSingles = shuffle([...singles].filter(s => !usedQuestions.has(s.question))).slice(0, multipleDeficit);
                selectedMultiples = [...selectedMultiples, ...remainingSingles];
            }

            // 检查是否题库不足
            const insufficient = selectedSingles.length < singleCount ||
                                selectedJudges.length < judgeCount;

            // 按题型排序：判断→单选→多选（30%:60%:10%），同题型内随机打乱
            let combined = [...shuffle([...selectedJudges]), ...shuffle([...selectedSingles]), ...shuffle([...selectedMultiples])];

            // 最终防御性截断：确保不超过totalQuestions
            if (combined.length > totalQuestions) {
                console.warn('prepareExamQuestions: 题目数量超过限制，截断至', totalQuestions, '实际:', combined.length);
                combined = combined.slice(0, totalQuestions);
            }

            return { questions: combined, insufficient, config };
        }

        // 按题型比例随机抽取题目（随机刷题模式）
        function shuffleQuestions(bank) {
            // 过滤掉选项不完整的题目（single需要4选项，multiple需要4选项）
            const validBank = bank.filter(q => {
                if (q.type === 'single') return q.options && q.options.length >= 4;
                if (q.type === 'multiple') return q.options && q.options.length >= 4;
                return true; // judge类型不需要选项
            });
            const singles = validBank.filter(q => q.type === 'single');
            const judges = validBank.filter(q => q.type === 'judge');
            const multiples = validBank.filter(q => q.type === 'multiple');
            
            // Fisher-Yates洗牌算法，确保彻底打乱
            const shuffle = arr => {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            };
            
            // 随机刷题统一500题
            let targetTotal = Math.min(500, bank.length);
            
            // 单选题60%:判断题30%:多选题10% 比例分配
            const multipleTarget = Math.round(targetTotal * 0.1);
            const singleTarget = Math.round(targetTotal * 0.6);
            const judgeTarget = targetTotal - singleTarget - multipleTarget;
            
            let selectedMultiples = shuffle([...multiples]).slice(0, multipleTarget);
            let multipleDeficit = multipleTarget - selectedMultiples.length;
            // 多选题不足时用单选题补位
            let selectedSingles, selectedJudges;
            if (multipleDeficit > 0) {
                const extraSingles = singleTarget + multipleDeficit;
                selectedSingles = shuffle([...singles]).slice(0, extraSingles);
                selectedJudges = shuffle([...judges]).slice(0, judgeTarget);
            } else {
                selectedSingles = shuffle([...singles]).slice(0, singleTarget);
                selectedJudges = shuffle([...judges]).slice(0, judgeTarget);
            }
            
            // 随机刷题：将三种题型完全混合打乱，体现随机感（不按题型分组）
            const combined = [...selectedJudges, ...selectedSingles, ...selectedMultiples];
            return shuffle(combined);
        }

        // 启动计时器
        function startTimer() {
            const config = getExamConfig();
            remainingTime = currentMode === 'exam' ? config.timeLimit : 0;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                remainingTime--;
                updateTimerDisplay();
                
                // 最后5分钟警告
                if (remainingTime <= 300) {
                    document.getElementById('timerBar').classList.add('warning');
                } else {
                    document.getElementById('timerBar').classList.remove('warning');
                }
                
                // 时间到自动交卷
                if (remainingTime <= 0) {
                    stopTimer();
                    submitAllExam();
                }
            }, 1000);
        }

        // 更新计时器显示（时:分:秒格式）
        function updateTimerDisplay() {
            const hours = Math.floor(remainingTime / 3600);
            const minutes = Math.floor((remainingTime % 3600) / 60);
            const seconds = remainingTime % 60;
            document.getElementById('timerDisplay').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // 显示题目
        function showQuestion(index) {
            const question = currentQuestionBank[index];
            isAnswered = userAnswers[index] !== null;
            
            // 更新题目标题
            const typeText = question.type === 'single' ? '单选题' : (question.type === 'multiple' ? '多选题' : '判断题');
            document.getElementById('questionType').textContent = typeText;
            document.getElementById('questionType').className = 
                'question-type' + (question.type === 'judge' ? ' judge' : '') + (question.type === 'multiple' ? ' multiple' : '');
            document.getElementById('questionNumber').textContent = `第 ${index + 1} 题（共 ${currentQuestionBank.length} 题）`;
            document.getElementById('questionContent').textContent = question.question;

            // 多选题显示提示
            const multipleHint = document.getElementById('multipleHint');
            if (question.type === 'multiple') {
                multipleHint.classList.remove('hidden');
            } else {
                multipleHint.classList.add('hidden');
            }

            // 已提交锁定提示
            const submittedHint = document.getElementById('submittedHint');
            if (isAnswered) {
                submittedHint.classList.remove('hidden');
            } else {
                submittedHint.classList.add('hidden');
            }

            // 生成选项
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            // 智能类型判断：如果type=single但选项不足4个，按实际选项数渲染
            const effectiveType = (question.type === 'single' && (!question.options || question.options.length < 2)) ? 'judge' : question.type;
            
            if (effectiveType === 'multiple') {
                optionsContainer.className = 'options';
                const selectedLetters = (userAnswers[index] && userAnswers[index] !== null) ? userAnswers[index].split('|') : [];
                question.options.forEach((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const isSelected = selectedLetters.includes(letter);
                    const optionDiv = createOption(letter, opt, isSelected);
                    optionDiv.dataset.letter = letter;
                    optionsContainer.appendChild(optionDiv);
                });
            } else if (effectiveType === 'single') {
                optionsContainer.className = 'options';
                question.options.forEach((opt, i) => {
                    const letter = String.fromCharCode(65 + i);
                    const isSelected = userAnswers[index] === letter;
                    const optionDiv = createOption(letter, opt, isSelected);
                    optionsContainer.appendChild(optionDiv);
                });
                // 选项不完整的单选题添加提示
                if (question.options && question.options.length < 4) {
                    const hint = document.createElement('div');
                    hint.style.cssText = 'color:#e67e22;font-size:0.85em;margin-top:8px;padding:4px 8px;background:#fff3e0;border-radius:4px;';
                    hint.textContent = '⚠ 此题选项不完整（仅' + question.options.length + '个选项），仅顺序刷题中可见';
                    optionsContainer.appendChild(hint);
                }
            } else {
                optionsContainer.className = 'options judge-options';
                ['正确', '错误'].forEach((opt, i) => {
                    const letter = opt === '正确' ? 'A' : 'B';
                    const isSelected = userAnswers[index] === opt;
                    const optionDiv = createOption(letter, opt, isSelected);
                    optionsContainer.appendChild(optionDiv);
                });
            }

            // 显示已答状态
            if (isAnswered) {
                showAnswerState(question);
            } else {
                document.getElementById('explanation').classList.remove('show');
            }

            // 更新按钮状态
            updateButtonState();
            updateStats();
            updateQuestionListState();
        }

        // 创建选项元素
        function createOption(letter, text, isSelected) {
            const div = document.createElement('div');
            div.className = 'option' + (isSelected ? ' selected' : '');
            if (isAnswered) div.classList.add('disabled');
            div.innerHTML = `
                <span class="option-letter">${letter}</span>
                <span class="option-text">${text}</span>
            `;
            div.onclick = (e) => selectOption(letter, e);
            return div;
        }

        // 选择选项
        function selectOption(letter, evt) {
            if (isAnswered) return;
            
            const question = currentQuestionBank[currentIndex];
            
            if (question.type === 'multiple') {
                // 多选题：存选项字母，用|分隔（与题库答案格式一致）
                let currentAnswer = userAnswers[currentIndex] || '';
                let selectedLetters = currentAnswer ? currentAnswer.split('|') : [];
                
                if (selectedLetters.includes(letter)) {
                    selectedLetters = selectedLetters.filter(l => l !== letter);
                } else {
                    selectedLetters.push(letter);
                }
                
                userAnswers[currentIndex] = selectedLetters.length > 0 ? selectedLetters.join('|') : null;
                
                // 更新选项样式
                const options = document.querySelectorAll('.option');
                options.forEach(opt => {
                    const thisLetter = opt.querySelector('.option-letter').textContent;
                    if (selectedLetters.includes(thisLetter)) {
                        opt.classList.add('selected');
                    } else {
                        opt.classList.remove('selected');
                    }
                });
                
                document.getElementById('submitBtn').disabled = (userAnswers[currentIndex] === null);
                updateStats();
                updateQuestionListState();
            } else {
                // 单选题和判断题
                let selectedAnswer;
                if (question.type === 'judge') {
                    selectedAnswer = letter === 'A' ? '正确' : '错误';
                } else {
                    // 单选题：存letter用于显示选中状态，但也需要文字匹配answer
                    selectedAnswer = letter;
                }
                
                userAnswers[currentIndex] = selectedAnswer;
                
                const options = document.querySelectorAll('.option');
                options.forEach(opt => {
                    opt.classList.remove('selected');
                });
                evt.target.closest('.option').classList.add('selected');
                
                // 自动提交：单选和判断题选择后立即显示答案和解析
                showAnswerState(question);
                isAnswered = true;
                document.getElementById('submitBtn').disabled = true;
                
                updateStats();
                updateQuestionListState();
            }
        }


        // 通用判断函数：根据题目类型和答案判断用户答案是否正确（不依赖DOM）
        function isAnswerCorrect(question, userAnswer) {
            if (userAnswer === null || userAnswer === undefined) return false;
            if (question.type === 'multiple') {
                // 多选题：答案和用户选择都用字母（如A|B|C），直接比较字母
                const correctLetters = (question.answer || '').split('|').map(t => t.trim()).sort();
                const userLetters = (userAnswer || '').split('|').map(t => t.trim()).sort();
                return correctLetters.length === userLetters.length && correctLetters.every((t, i) => t === userLetters[i]);
            } else if (question.type === 'single') {
                // single题：userAnswer存的是letter(如"A")
                // answer可能是文字(如"10秒扫视一次")或字母(如"D")
                const ans = question.answer || '';
                const options = question.options || [];
                // 如果answer就是字母
                if (/^[A-D]$/.test(ans)) {
                    return userAnswer === ans;
                }
                // answer是文字，需要找到对应的字母
                const ansClean = ans.replace(/^[A-Z][.、\s]\s*/, '').trim();
                for (let i = 0; i < options.length; i++) {
                    const optText = options[i].replace(/^[A-Z][.、\s]\s*/, '').trim();
                    if (optText === ansClean) {
                        const correctLetter = String.fromCharCode(65 + i);
                        return userAnswer === correctLetter;
                    }
                }
                // 兜底：直接比较
                return userAnswer === ans;
            } else {
                // judge题
                return userAnswer === question.answer;
            }
        }

        // 获取正确答案的字母（仅single题有用）
        function getCorrectLetter(question) {
            if (question.type !== 'single') return null;
            const ans = question.answer || '';
            const options = question.options || [];
            if (/^[A-D]$/.test(ans)) return ans;
            const ansClean = ans.replace(/^[A-Z][.、\s]\s*/, '').trim();
            for (let i = 0; i < options.length; i++) {
                const optText = options[i].replace(/^[A-Z][.、\s]\s*/, '').trim();
                if (optText === ansClean) {
                    return String.fromCharCode(65 + i);
                }
            }
            return null;
        }

        // 提交答案
        function submitAnswer() {
            const question = currentQuestionBank[currentIndex];
            
            if (userAnswers[currentIndex] === null) {
                alert('请先选择一个答案！');
                return;
            }
            
            if (question.type === 'multiple' && userAnswers[currentIndex].length < 2) {
                alert('多选题至少选择两个选项！');
                return;
            }
            
            showAnswerState(question);
            isAnswered = true;
            
            // 更新按钮状态
            document.getElementById('submitBtn').disabled = true;
            updateQuestionListState();
            updateStats();
        }

        // 显示答案状态
        function showAnswerState(question) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.add('disabled'));
            
            const correctAnswer = question.answer;
            const userAnswer = userAnswers[currentIndex];
            
            // 通用答案判断函数（使用数据，不依赖DOM）
            function checkCorrect(q, ua) {
                return isAnswerCorrect(q, ua);
            }
            
            const isCorrect = checkCorrect(question, userAnswer);
            
            // 标记选项：正确答案绿色，错误选择红色
            if (question.type === 'multiple') {
                // 多选题：答案和用户选择都用字母（如A|B|C），直接比较字母
                const correctLetters = (correctAnswer || '').split('|').map(t => t.trim());
                const userLetters = (userAnswer || '').split('|').map(t => t.trim());
                options.forEach(opt => {
                    const letter = opt.querySelector('.option-letter').textContent;
                    if (correctLetters.includes(letter)) {
                        opt.classList.add('correct');
                    } else if (userLetters.includes(letter)) {
                        opt.classList.add('wrong');
                    }
                });
            } else if (question.type === 'single') {
                const correctLetter = getCorrectLetter(question);
                options.forEach(opt => {
                    const letter = opt.querySelector('.option-letter').textContent;
                    if (letter === correctLetter) {
                        opt.classList.add('correct');
                    } else if (letter === userAnswer && !isCorrect) {
                        opt.classList.add('wrong');
                    }
                });
            } else {
                // 判断题
                options.forEach(opt => {
                    const text = opt.querySelector('.option-text').textContent;
                    if (text === correctAnswer) {
                        opt.classList.add('correct');
                    } else if (text === userAnswer && !isCorrect) {
                        opt.classList.add('wrong');
                    }
                });
            }
            
            // 显示解析
            const explanation = document.getElementById('explanation');
            let expText = '';
            // 答错时显示正确答案
            if (!isCorrect) {
                let answerDisplay = correctAnswer;
                if (question.type === 'multiple') {
                    answerDisplay = correctAnswer.split('|').join('；');
                }
                expText += '【正确答案】' + answerDisplay + '\n\n';
            }
            expText += question.explanation || '';
            if (question.page) {
                expText += '（课本第' + question.page + '页）';
            }
            document.getElementById('explanationContent').textContent = expText;
            explanation.classList.add('show');
            
            document.getElementById('submitBtn').disabled = true;
            updateStats();
        }

        // 更新按钮状态
        function updateButtonState() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === currentQuestionBank.length - 1;
            document.getElementById('submitBtn').disabled = userAnswers[currentIndex] === null || isAnswered;
        }

        // 更新统计数据
        function updateStats() {
            if (sequentialMode) { updateSequentialStats(); return; }
            let correct = 0;
            let wrong = 0;
            let answered = 0;
            
            userAnswers.forEach((answer, i) => {
                if (answer !== null) {
                    answered++;
                    const question = currentQuestionBank[i];
                    let isCorrect;
                    if (question.type === 'multiple') {
                        // 多选题：统一用字母比较
                        const correctLetters = (question.answer || '').split('|').map(t => t.trim()).sort();
                        const userLetters = (answer || '').split('|').map(t => t.trim()).sort();
                        isCorrect = correctLetters.length === userLetters.length && correctLetters.every((t, idx) => t === userLetters[idx]);
                    } else if (question.type === 'single') {
                        isCorrect = isAnswerCorrect(question, answer);
                    } else {
                        isCorrect = answer === question.answer;
                    }
                    if (isCorrect) correct++;
                    else wrong++;
                }
            });
            
            const unanswered = currentQuestionBank.length - answered;
            
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('unansweredCount').textContent = unanswered;
        }

        // 上一题
        function prevQuestion() {
            if (sequentialMode) { prevSequentialQuestion(); return; }
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion(currentIndex);
            }
        }

        // 下一题
        function nextQuestion() {
            if (sequentialMode) { nextSequentialQuestion(); return; }
            if (currentIndex < currentQuestionBank.length - 1) {
                currentIndex++;
                showQuestion(currentIndex);
            }
        }

        // 渲染题目列表
        function renderQuestionList() {
            const list = document.getElementById('questionList');
            list.innerHTML = '';
            
            currentQuestionBank.forEach((_, i) => {
                const item = document.createElement('div');
                item.className = 'question-item';
                item.textContent = i + 1;
                item.onclick = () => jumpToQuestion(i);
                list.appendChild(item);
            });
        }

        // 更新题目列表状态
        function updateQuestionListState() {
            if (sequentialMode) { updateSequentialListState(); return; }
            const items = document.querySelectorAll('.question-item');
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;
            
            items.forEach((item, i) => {
                item.className = 'question-item';
                
                if (i === currentIndex) {
                    item.classList.add('current');
                } else if (userAnswers[i] !== null) {
                    const question = currentQuestionBank[i];
                    if (isAnswerCorrect(question, userAnswers[i])) {
                        item.classList.add('correct');
                        correct++;
                    } else {
                        item.classList.add('wrong');
                        wrong++;
                    }
                } else {
                    item.classList.add('unanswered');
                    unanswered++;
                }
            });
            
            // 更新列表统计
            document.getElementById('listCorrectCount').textContent = correct;
            document.getElementById('listWrongCount').textContent = wrong;
            document.getElementById('listUnansweredCount').textContent = unanswered;
        }

        // 跳转题目
        function jumpToQuestion(index) {
            currentIndex = index;
            showQuestion(currentIndex);
            toggleQuestionList();
        }

        // 切换题目列表显示
        function toggleQuestionList() {
            document.getElementById('questionListPanel').classList.toggle('show');
            document.getElementById('overlay').classList.toggle('show');
        }

        // 提交全部考试
        function submitAllExam() {
            stopTimer();
            examFinished = true;
            
            // 检查是否有未答题目
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (!confirm(`还有 ${unanswered} 题未答，确定要交卷吗？`)) {
                    // 如果用户取消，重新启动计时器
                    if (currentMode === 'exam') {
                        startTimer();
                    }
                    return;
                }
            }
            
            showResult();
        }

        // 显示结果
        function showResult() {
            const config = getExamConfig();
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;
            
            userAnswers.forEach((answer, i) => {
                if (answer !== null) {
                    const question = currentQuestionBank[i];
                    let isCorrect;
                    if (question.type === 'multiple') {
                        // 多选题：统一用字母比较
                        const correctLetters = (question.answer || '').split('|').map(t => t.trim()).sort();
                        const userLetters = (answer || '').split('|').map(t => t.trim()).sort();
                        isCorrect = correctLetters.length === userLetters.length && correctLetters.every((t, idx) => t === userLetters[idx]);
                    } else {
                        isCorrect = isAnswerCorrect(question, answer);
                    }
                    if (isCorrect) correct++;
                    else wrong++;
                } else {
                    unanswered++;
                }
            });
            
            const totalAnswered = correct + wrong;
            const totalQuestions = currentQuestionBank.length;
            let totalScore = 0;
            userAnswers.forEach((answer, i) => {
                if (answer !== null) {
                    const question = currentQuestionBank[i];
                    let isCorrect;
                    if (question.type === 'multiple') {
                        // 多选题：统一用字母比较
                        const correctLetters = (question.answer || '').split('|').map(t => t.trim()).sort();
                        const userLetters = (answer || '').split('|').map(t => t.trim()).sort();
                        isCorrect = correctLetters.length === userLetters.length && correctLetters.every((t, idx) => t === userLetters[idx]);
                    } else {
                        isCorrect = isAnswerCorrect(question, answer);
                    }
                    if (isCorrect) {
                        if (question.type === 'single') totalScore += config.singleScore;
                        else if (question.type === 'multiple') totalScore += config.multipleScore;
                        else totalScore += config.judgeScore;
                    }
                }
            });
            
            const percentage = totalAnswered > 0 ? Math.round((correct / totalAnswered) * 100) : 0;
            const isPass = currentMode === 'exam' ? (totalScore >= config.totalScore * 0.6) : (percentage >= 60);
            
            document.getElementById('questionCard').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
            document.getElementById('reviewSection').classList.add('hidden');
            document.getElementById('timerBar').classList.add('hidden');
            document.getElementById('listToggleBtn').classList.add('hidden');
            
            if (currentMode === 'exam') {
                document.getElementById('resultIcon').textContent = isPass ? '🏆' : '😢';
                document.getElementById('resultTitle').textContent = isPass ? '恭喜通过考试！' : '未通过考试';
                document.getElementById('finalScore').textContent = totalScore + '分';
                document.getElementById('finalScore').className = 'result-score ' + (isPass ? 'pass' : 'fail');
                document.getElementById('resultDetail').textContent = `正确率 ${percentage}%（${correct}/${totalAnswered}）`;
            } else {
                document.getElementById('resultIcon').textContent = percentage >= 80 ? '🎉' : (percentage >= 60 ? '👍' : '💪');
                document.getElementById('resultTitle').textContent = '刷题完成！';
                document.getElementById('finalScore').textContent = percentage + '%';
                document.getElementById('finalScore').className = 'result-score ' + (isPass ? 'pass' : 'fail');
                document.getElementById('resultDetail').textContent = `正确 ${correct} 题，错误 ${wrong} 题`;
            }
            
            document.getElementById('resultCorrect').textContent = correct;
            document.getElementById('resultWrong').textContent = wrong;
            document.getElementById('resultUnanswered').textContent = unanswered;
        }

        // 显示答题回顾
        function showReview() {
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('reviewSection').classList.remove('hidden');
            
            const reviewList = document.getElementById('reviewList');
            reviewList.innerHTML = '';
            
            currentQuestionBank.forEach((question, i) => {
                const userAnswer = userAnswers[i];
                let isCorrect = false;
                let userAnswerText = '未作答';
                let correctAnswerText = '';
                
                if (userAnswer !== null) {
                    isCorrect = isAnswerCorrect(question, userAnswer);
                    if (question.type === 'judge') {
                        userAnswerText = userAnswer;
                        correctAnswerText = question.answer;
                    } else if (question.type === 'single') {
                        const correctLetter = getCorrectLetter(question);
                        const userIdx = userAnswer.charCodeAt(0) - 65;
                        userAnswerText = (userIdx >= 0 && userIdx < question.options.length) ? question.options[userIdx] : userAnswer;
                        if (correctLetter !== null) {
                            const correctIdx = correctLetter.charCodeAt(0) - 65;
                            correctAnswerText = (correctIdx >= 0 && correctIdx < question.options.length) ? question.options[correctIdx] : question.answer;
                        } else {
                            correctAnswerText = question.answer;
                        }
                    } else {
                        // multiple：将字母转换为选项文本显示
                        const userLetters = userAnswer.split('|').map(t => t.trim());
                        userAnswerText = userLetters.map(l => {
                            const idx = l.charCodeAt(0) - 65;
                            return (idx >= 0 && idx < question.options.length) ? question.options[idx] : l;
                        }).join('；');
                        const correctLetters = (question.answer || '').split('|').map(t => t.trim());
                        correctAnswerText = correctLetters.map(l => {
                            const idx = l.charCodeAt(0) - 65;
                            return (idx >= 0 && idx < question.options.length) ? question.options[idx] : l;
                        }).join('；');
                    }
                } else {
                    if (question.type === 'judge') {
                        correctAnswerText = question.answer;
                    } else if (question.type === 'single') {
                        const correctLetter = getCorrectLetter(question);
                        if (correctLetter !== null) {
                            const correctIdx = correctLetter.charCodeAt(0) - 65;
                            correctAnswerText = (correctIdx >= 0 && correctIdx < question.options.length) ? question.options[correctIdx] : question.answer;
                        } else {
                            correctAnswerText = question.answer;
                        }
                    } else {
                        correctAnswerText = question.answer;
                    }
                }
                
                const typeText = question.type === 'single' ? '单选题' : (question.type === 'multiple' ? '多选题' : '判断题');
                
                const div = document.createElement('div');
                div.className = 'review-question';
                div.innerHTML = `
                    <div class="review-question-header">
                        <span class="review-question-number">第 ${i + 1} 题 · ${typeText}</span>
                        <span class="review-result ${userAnswer === null ? 'wrong' : (isCorrect ? 'correct' : 'wrong')}">
                            ${userAnswer === null ? '未答' : (isCorrect ? '正确' : '错误')}
                        </span>
                    </div>
                    <div class="review-question-content">${question.question}</div>
                    <div class="review-answer">
                        <span class="review-answer-label">你的答案：</span>
                        <span class="review-answer-value ${userAnswer !== null && isCorrect ? 'correct' : (userAnswer !== null ? 'wrong' : '')}">${userAnswerText}</span>
                    </div>
                    ${userAnswer !== null && !isCorrect ? `
                    <div class="review-answer">
                        <span class="review-answer-label">正确答案：</span>
                        <span class="review-answer-value correct">${correctAnswerText}</span>
                    </div>
                    ` : ''}
                    <div class="review-explanation">📖 ${question.explanation}${question.page ? '（课本第' + question.page + '页）' : ''}</div>
                `;
                reviewList.appendChild(div);
            });
        }

        // 隐藏答题回顾
        function hideReview() {
            document.getElementById('reviewSection').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
        }

        // 重新开始
        function restartQuiz() {
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('questionCard').classList.remove('hidden');
            document.getElementById('reviewSection').classList.add('hidden');
            
            // 重新选择题目
            selectMode(currentMode);
        }

        // 页面加载完成后初始化
        bootApp();

        // ==================== 顺序刷题模式 ====================

        function getSeqProgressKey() {
            let bankKey;
            if (currentExamType === '救生员') bankKey = 'lifeguard';
            else bankKey = currentLevel === '中级' ? 'instructor_senior' : 'instructor';
            return 'seq_progress_' + bankKey;
        }

        function loadSeqProgress() {
            try { return JSON.parse(localStorage.getItem(getSeqProgressKey()) || '{}'); }
            catch(e) { return {}; }
        }

        function saveSeqProgress(progress) {
            localStorage.setItem(getSeqProgressKey(), JSON.stringify(progress));
        }

        // 进入顺序刷题模式
        async function enterSequentialMode() {
            // 防止并发切换
            if (isTransitioning) return;
            isTransitioning = true;
            
            // 隐藏所有其他页面，防止重叠
            document.getElementById('quizPage').classList.add('hidden');
            document.getElementById('modeSelectPage').classList.add('hidden');
            document.getElementById('listToggleBtn').classList.add('hidden');
            document.getElementById('timerBar').classList.add('hidden');
            
            // 显示加载提示
            showLoading('正在加载顺序题库，请稍等…');
            
            let bankKey;
            if (currentExamType === '救生员') bankKey = 'lifeguard';
            else bankKey = currentLevel === '中级' ? 'instructor_senior' : 'instructor';

            await loadOrderedBankData(bankKey);
            
            // 隐藏加载提示
            hideLoading();

            if (bankKey === 'lifeguard') sequentialBank = orderedLifeguardBank;
            else if (bankKey === 'instructor') sequentialBank = orderedInstructorBank;
            else sequentialBank = orderedInstructorSeniorBank;

            if (!sequentialBank || !sequentialBank.chapters) {
                alert('顺序题库加载失败，请稍后重试');
                hideLoading();
                isTransitioning = false; // 释放锁
                return;
            }

            // 展平题目列表
            sequentialFlatQuestions = [];
            sequentialBank.chapters.forEach((ch, ci) => {
                ch.sections.forEach((sec, si) => {
                    sec.questions.forEach((q, qi) => {
                        sequentialFlatQuestions.push({
                            ...q,
                            chapterIdx: ci,
                            sectionIdx: si,
                            questionIdx: qi,
                            chapterTitle: ch.title,
                            sectionTitle: sec.title
                        });
                    });
                });
            });

            // 切换到章节选择页
            document.getElementById('modeSelectPage').classList.add('hidden');
            document.getElementById('chapterSelectPage').classList.remove('hidden');

            const levelDisplay = currentLevel + (currentExamType === '救生员' ? '救生员' : '游泳指导员');
            document.getElementById('chapterSelectTitle').textContent = levelDisplay + ' - 顺序刷题';
            document.getElementById('chapterTopBarTitle').textContent = levelDisplay + ' - 顺序刷题';

            renderChapterList();
            isTransitioning = false; // 释放锁
        }

        // 返回模式选择页（从章节选择页）
        function goBackToModeSelectFromChapter() {
            document.getElementById('chapterSelectPage').classList.add('hidden');
            document.getElementById('modeSelectPage').classList.remove('hidden');
        }

        // 渲染章节列表
        function renderChapterList() {
            const list = document.getElementById('chapterList');
            list.innerHTML = '';
            const progress = loadSeqProgress();

            // 判断是否为指导员（需要区分游泳理论和公共理论）
            const isInstructor = currentExamType !== '救生员';
            // 指导员：第X章=游泳理论，专题X/补充=公共理论
            // 救生员：全部为游泳理论，无需分组
            const parts = isInstructor
                ? [{ label: '🏊 游泳理论', test: t => /^第/.test(t) },
                   { label: '📚 公共理论', test: t => /^(专题|补充|初级公共|中级公共)/.test(t) }]
                : [{ label: '', test: () => true }];

            let ci = 0; // 全局章节索引
            parts.forEach(part => {
                const partChapters = sequentialBank.chapters.filter((ch, idx) => {
                    // 用原始索引匹配
                    return part.test(ch.title.trim());
                });

                if (partChapters.length === 0) return;

                // 如果有分组标签，添加分隔标题
                if (part.label) {
                    const partHeader = document.createElement('div');
                    partHeader.className = 'part-header';
                    partHeader.textContent = part.label;
                    list.appendChild(partHeader);
                }

                // 遍历原始chapters数组，找到属于当前part的章节
                sequentialBank.chapters.forEach((ch, origIdx) => {
                    if (!part.test(ch.title.trim())) return;

                    const chapterQCount = ch.sections.reduce((s, sec) => s + sec.questions.length, 0);
                    let chapterDone = 0;

                    const chapterDiv = document.createElement('div');
                    chapterDiv.className = 'chapter-item';

                    const sectionsHtml = ch.sections.map((sec, si) => {
                        const secKey = origIdx + '.' + si;
                        const done = progress[secKey] || 0;
                        chapterDone += done;
                        let cls = 'section-item';
                        if (done >= sec.questions.length && sec.questions.length > 0) cls += ' completed';
                        else if (done > 0) cls += ' in-progress';
                        return '<div class="' + cls + '" onclick="startSequentialPractice(' + origIdx + ',' + si + ')">' +
                            '<span class="section-title">' + sec.title + '</span>' +
                            '<span class="section-count">' + done + '/' + sec.questions.length + '题</span>' +
                            '<span class="section-arrow">→</span></div>';
                    }).join('');

                    chapterDiv.innerHTML =
                        '<div class="chapter-header" onclick="this.parentElement.classList.toggle(\'expanded\')">' +
                        '<span class="chapter-title">' + ch.title + '</span>' +
                        '<span class="chapter-count">' + chapterDone + '/' + chapterQCount + '题</span>' +
                        '<span class="chapter-arrow">▼</span></div>' +
                        '<div class="chapter-sections">' + sectionsHtml + '</div>';

                    list.appendChild(chapterDiv);
                });
            });
        }

        // 开始顺序练习（从指定章节和小节）
        function startSequentialPractice(chapterIdx, sectionIdx) {
            // 找到该小节在展平数组中的起始索引
            let flatIdx = 0;
            for (let ci = 0; ci < sequentialBank.chapters.length; ci++) {
                for (let si = 0; si < sequentialBank.chapters[ci].sections.length; si++) {
                    if (ci === chapterIdx && si === sectionIdx) {
                        sequentialCurrentIdx = flatIdx;
                        showSequentialQuiz();
                        return;
                    }
                    flatIdx += sequentialBank.chapters[ci].sections[si].questions.length;
                }
            }
        }

        // 显示顺序刷题答题页
        function showSequentialQuiz() {
            document.getElementById('chapterSelectPage').classList.add('hidden');
            document.getElementById('quizPage').classList.remove('hidden');
            document.getElementById('listToggleBtn').classList.remove('hidden');
            document.getElementById('timerBar').classList.add('hidden');
            document.getElementById('bankWarning').classList.add('hidden');
            document.getElementById('submitAllBtn').style.display = 'none';
            document.getElementById('seqPosition').classList.add('show');

            sequentialMode = true;
            currentMode = 'sequential';
            currentQuestionBank = sequentialFlatQuestions;

            const levelDisplay = currentLevel + (currentExamType === '救生员' ? '救生员' : '游泳指导员');
            document.getElementById('currentExamType').textContent = levelDisplay;
            document.getElementById('pageTitle').textContent = '顺序刷题';

            // 从localStorage恢复答题记录（避免跨小节丢失）
            const savedAns = localStorage.getItem(getSeqProgressKey() + '_answers');
            if (savedAns) {
                try {
                    userAnswers = JSON.parse(savedAns);
                    if (!Array.isArray(userAnswers) || userAnswers.length !== sequentialFlatQuestions.length) {
                        userAnswers = new Array(sequentialFlatQuestions.length).fill(null);
                    }
                } catch(e) {
                    userAnswers = new Array(sequentialFlatQuestions.length).fill(null);
                }
            } else {
                userAnswers = new Array(sequentialFlatQuestions.length).fill(null);
            }
            currentIndex = 0;
            isAnswered = false;
            examFinished = false;

            renderSequentialQuestionList();
            showSequentialQuestion(sequentialCurrentIdx);
        }

        // 显示顺序刷题题目
        function showSequentialQuestion(index) {
            sequentialCurrentIdx = index;
            currentIndex = index;
            const q = sequentialFlatQuestions[index];
            if (!q) return;

            // 更新位置信息
            const seqPos = document.getElementById('seqPosition');
            seqPos.textContent = q.chapterTitle + ' > ' + q.sectionTitle + ' > 第' + (q.questionIdx + 1) + '题';

            // 更新题型和题号
            let typeText = '未知题型';
            // hasAnswer未定义时（undefined），按有答案处理；仅hasAnswer明确为false时才算无答案
            const hasAnswer = q.hasAnswer !== false;
            if (hasAnswer) {
                if (q.type === 'single') typeText = '单选题';
                else if (q.type === 'judge') typeText = '判断题';
                else if (q.type === 'multiple') typeText = '多选题';
            } else {
                typeText = '暂无答案';
            }
            document.getElementById('questionType').textContent = typeText;
            document.getElementById('questionNumber').textContent = '第' + (index + 1) + '/' + sequentialFlatQuestions.length + '题';
            document.getElementById('questionContent').textContent = q.question;

            // 隐藏多选提示和已提交提示
            document.getElementById('multipleHint').classList.add('hidden');
            document.getElementById('submittedHint').classList.add('hidden');

            // 显示选项
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            if (!hasAnswer) {
                // 无答案数据 - 显示提示
                optionsContainer.className = 'options';
                const hint = document.createElement('div');
                hint.className = 'no-answer-hint';
                hint.textContent = '📝 此题暂无答案数据，仅展示题目文本';
                optionsContainer.appendChild(hint);
                document.getElementById('explanation').classList.remove('show');
                document.getElementById('submitBtn').style.display = 'none';
                document.getElementById('prevBtn').style.display = '';
                document.getElementById('nextBtn').style.display = '';
                isAnswered = false;
            } else {
                document.getElementById('submitBtn').style.display = '';
                // 复用现有showQuestion的选项渲染逻辑
                showQuestion(index);
                // 恢复位置信息（showQuestion可能覆盖了一些状态）
                seqPos.textContent = q.chapterTitle + ' > ' + q.sectionTitle + ' > 第' + (q.questionIdx + 1) + '题';
                document.getElementById('questionNumber').textContent = '第' + (index + 1) + '/' + sequentialFlatQuestions.length + '题';
            }

            // 更新导航按钮
            document.getElementById('prevBtn').onclick = prevSequentialQuestion;
            document.getElementById('nextBtn').onclick = nextSequentialQuestion;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === sequentialFlatQuestions.length - 1;

            // 保存进度
            saveSeqProgressItem(q.chapterIdx, q.sectionIdx, q.questionIdx);

            // 更新统计
            updateSequentialStats();
            updateSequentialListState();
        }

        // 上一题
        function prevSequentialQuestion() {
            if (sequentialCurrentIdx > 0) {
                showSequentialQuestion(sequentialCurrentIdx - 1);
            }
        }

        // 下一题
        function nextSequentialQuestion() {
            if (sequentialCurrentIdx < sequentialFlatQuestions.length - 1) {
                showSequentialQuestion(sequentialCurrentIdx + 1);
            }
        }

        // 保存进度
        function saveSeqProgressItem(chapterIdx, sectionIdx, questionIdx) {
            const progress = loadSeqProgress();
            const key = chapterIdx + '.' + sectionIdx;
            // 记录该section中已完成的最高题号+1
            const current = progress[key] || 0;
            progress[key] = Math.max(current, questionIdx + 1);
            saveSeqProgress(progress);
        }

        // 更新顺序刷题统计
        function updateSequentialStats() {
            let answered = 0, correct = 0, wrong = 0;
            for (let i = 0; i < sequentialFlatQuestions.length; i++) {
                if (userAnswers[i] !== null) {
                    answered++;
                    const q = sequentialFlatQuestions[i];
                    const qHasAnswer = q.hasAnswer !== false;
                    if (qHasAnswer && isAnswerCorrect(q, userAnswers[i])) correct++;
                    else if (qHasAnswer) wrong++;
                }
            }
            document.getElementById('answeredCount').textContent = answered;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('unansweredCount').textContent = sequentialFlatQuestions.length - answered;
            // 持久化答题记录，避免跨小节丢失
            try {
                localStorage.setItem(getSeqProgressKey() + '_answers', JSON.stringify(userAnswers));
            } catch(e) {}
        }

        // 渲染顺序刷题题目目录
        function renderSequentialQuestionList() {
            const list = document.getElementById('questionList');
            list.innerHTML = '';

            // 按章节分组
            let globalIdx = 0;
            sequentialBank.chapters.forEach((ch, ci) => {
                ch.sections.forEach((sec, si) => {
                    // 章节标题
                    const header = document.createElement('div');
                    header.className = 'question-list-section-header';
                    header.style.cssText = 'grid-column:1/-1;font-size:12px;color:#1a73e8;font-weight:600;padding:8px 0;border-top:1px solid #eee;';
                    header.textContent = ch.title + ' - ' + sec.title;
                    list.appendChild(header);

                    // 题目
                    sec.questions.forEach((q, qi) => {
                        const btn = document.createElement('div');
                        btn.className = 'question-list-item';
                        btn.textContent = qi + 1;
                        btn.dataset.index = globalIdx;
                        btn.onclick = function() {
                            showSequentialQuestion(parseInt(this.dataset.index));
                            document.getElementById('questionListPanel').classList.remove('show');
                        };
                        list.appendChild(btn);
                        globalIdx++;
                    });
                });
            });
        }

        // 更新顺序刷题目录状态
        function updateSequentialListState() {
            const items = document.querySelectorAll('.question-list-item');
            let correct = 0, wrong = 0, unanswered = 0;
            items.forEach((item, i) => {
                item.classList.remove('current', 'correct', 'wrong');
                if (i === sequentialCurrentIdx) {
                    item.classList.add('current');
                }
                if (userAnswers[i] !== null && sequentialFlatQuestions[i] && sequentialFlatQuestions[i].hasAnswer !== false) {
                    if (isAnswerCorrect(sequentialFlatQuestions[i], userAnswers[i])) {
                        item.classList.add('correct');
                        correct++;
                    } else {
                        item.classList.add('wrong');
                        wrong++;
                    }
                } else {
                    unanswered++;
                }
            });
            // 更新目录统计
            document.getElementById('listCorrectCount').textContent = correct;
            document.getElementById('listWrongCount').textContent = wrong;
            document.getElementById('listUnansweredCount').textContent = unanswered;
        }
    </script>
